                     "cart": [], "cart_count": 0,
                     "disclaimer": "DEMO MODEL - ILLUSTRATIVE PARAMETERS - NOT FOR FOOD-SAFETY DECISIONS"}
              return {"final_md": out, "final_state": json.dumps(s), "api_json": json.dumps(api)}
